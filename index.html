*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"InterE",system-ui,-apple-system,"Segoe UI",sans-serif;background:linear-gradient(135deg,#0B1B33 0%,#13305A 58%,#165A70 100%);color:#fff;display:flex;align-items:center;justify-content:center;padding:24px;min-height:100vh}
.box{width:100%;max-width:520px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.18);border-radius:22px;padding:36px 32px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.eb{font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:#A9C9E0;font-weight:700}
h1{font-size:30px;line-height:1.15;margin-top:10px;font-weight:800}
h1 span{color:#6FE0D2}
p{font-size:18px;line-height:1.5;color:#D6E4F0;margin-top:12px}
label{display:block;font-size:18px;font-weight:700;margin-top:24px}
input{width:100%;margin-top:10px;font:inherit;font-size:22px;padding:16px 18px;border-radius:14px;border:2px solid rgba(255,255,255,.35);background:#fff;color:#0F2340;outline:none}
input:focus{border-color:#6FE0D2;box-shadow:0 0 0 4px rgba(111,224,210,.3)}
button{width:100%;margin-top:16px;font:inherit;font-size:21px;font-weight:800;padding:16px;border-radius:14px;border:0;background:#6FE0D2;color:#0B1B33;cursor:pointer;min-height:60px}
button:disabled{opacity:.6;cursor:wait}
.msg{min-height:28px;margin-top:14px;font-size:17px;color:#FFD9A0}
.tip{font-size:15px;color:#9FB6CC;margin-top:18px}
</style>
