function primer(){return '<details><summary>Primer: how these AI tools work, why they make things up, and how to check them</summary>'+
'<p><strong>How they work.</strong> Chat assistants are trained on large amounts of text and generate answers by predicting likely wording. Unless a tool searches sources while answering, it is writing from patterns, not looking facts up.</p>'+
'<p><strong>Why they make things up.</strong> Because they aim for fluent, plausible text, they can produce statements, numbers, or references that sound right but are wrong. This is often called hallucination, and it can include citations to papers that do not exist.</p>'+
'<p><strong>How to check them.</strong> Prefer tools that cite sources, and open the sources. Test a tool first on questions you already know. Verify doses and other critical facts against a trusted reference. Ask it to list its assumptions. Keep a human review step for anything that goes into a record or to a client or patient.</p></details>'}

'<p><strong>Caption everything.</strong> Many people watch with the sound off. Proofread auto captions, especially drug and medical terms.</p>'+
